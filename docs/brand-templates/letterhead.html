<!doctype html>
<!--
  Ilelah Technologies A4 letterhead.
  Open in Chrome or Edge, click into the letter area to type, then Print > Save as PDF
  (paper size A4, margins "None", "Background graphics" ticked).
  For Word: insert ../../public/brand/ilelah-logo-horizontal-2000.png in the header instead.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ilelah Technologies letterhead</title>
<style>
  @page { size: A4; margin: 0; }
  body { margin: 0; font-family: Arial, Helvetica, sans-serif; color: #12161c; }
  .page { width: 210mm; min-height: 297mm; box-sizing: border-box; padding: 18mm 20mm 24mm; position: relative; }
  header { display: flex; justify-content: space-between; align-items: flex-end; padding-bottom: 6mm; border-bottom: 0.6mm solid #00143c; }
  header img { height: 16mm; }
  .contact { text-align: right; font-size: 9pt; line-height: 1.5; color: #4a5363; }
  .accent { width: 18mm; height: 1mm; background: #c8922a; margin-top: -0.8mm; }
  .letter { margin-top: 14mm; font-size: 11pt; line-height: 1.6; min-height: 200mm; outline: none; }
  footer { position: absolute; left: 20mm; right: 20mm; bottom: 12mm; font-size: 8.5pt; color: #5b6475; display: flex; justify-content: space-between; border-top: 0.3mm solid #dfe3ea; padding-top: 3mm; }
</style>
</head>
<body>
<div class="page">
  <header>
    <img src="../../public/brand/ilelah-logo-horizontal.png" alt="Ilelah Technologies">
    <div class="contact">
      +234 706 679 3518<br>
      walid@ilelahtech.com<br>
      www.ilelahtech.com
    </div>
  </header>
  <div class="accent"></div>
  <div class="letter" contenteditable="true">
    <p>[Date]</p>
    <p>[Recipient name]<br>[Organisation]<br>[Address]</p>
    <p>Dear [Name],</p>
    <p>[Letter text]</p>
    <p>Yours sincerely,</p>
    <p><br>Walid Bello Ilelah<br>Founder and CEO</p>
  </div>
  <footer>
    <span>Ilelah Technologies, based in Bauchi, Nigeria</span>
    <span>Technology. Innovation. Solutions.</span>
  </footer>
</div>
</body>
</html>
